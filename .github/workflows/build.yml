name: Build Installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build .deb and .rpm (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build binary with PyInstaller
        run: pyinstaller --onefile --name zora rag.py

      - name: Install rpm build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build .deb package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0.${GITHUB_SHA:0:7}"
          fi
          VERSION="${VERSION#v}"

          mkdir -p pkg-deb/DEBIAN pkg-deb/usr/bin out
          cp dist/zora pkg-deb/usr/bin/zora
          chmod 755 pkg-deb/usr/bin/zora

          cat > pkg-deb/DEBIAN/control <<EOF
          Package: zora
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Equipe de Desenvolvimento
          Description: Assistente Pessoal de Pesquisa
          EOF

          cp scripts/after-install.sh pkg-deb/DEBIAN/postinst
          chmod 755 pkg-deb/DEBIAN/postinst

          dpkg-deb --build pkg-deb out/zora_${VERSION}_amd64.deb

      - name: Build .rpm package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0.${GITHUB_SHA:0:7}"
          fi
          VERSION="${VERSION#v}"

          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT} pkg-rpm/usr/bin out
          cp dist/zora pkg-rpm/usr/bin/zora
          cp scripts/after-install.sh pkg-rpm/usr/bin/zora-after-install.sh
          chmod 755 pkg-rpm/usr/bin/zora pkg-rpm/usr/bin/zora-after-install.sh

          tar -C pkg-rpm -czf rpmbuild/SOURCES/zora-src.tar.gz .

          cat > rpmbuild/SPECS/zora.spec <<EOF
          Name: zora
          Version: ${VERSION}
          Release: 1
          Summary: Assistente Pessoal de Pesquisa
          License: MIT
          Group: Applications/Productivity
          BuildArch: x86_64
          Source0: zora-src.tar.gz

          %description
          Assistente Pessoal de Pesquisa

          %prep
          %setup -c -n zora-src

          %build

          %install
          mkdir -p %{buildroot}/usr/bin
          cp %{_builddir}/zora-src/usr/bin/zora %{buildroot}/usr/bin/zora
          cp %{_builddir}/zora-src/usr/bin/zora-after-install.sh %{buildroot}/usr/bin/zora-after-install.sh
          chmod 755 %{buildroot}/usr/bin/zora %{buildroot}/usr/bin/zora-after-install.sh

          %post
          /usr/bin/zora-after-install.sh

          %files
          /usr/bin/zora
          /usr/bin/zora-after-install.sh
          EOF

          rpmbuild --define "_topdir $PWD/rpmbuild" -bb rpmbuild/SPECS/zora.spec
          cp rpmbuild/RPMS/x86_64/*.rpm out/

      - name: Upload Linux packages as artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: out/

  build-windows:
    name: Build .exe (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e .

      - name: Build .exe with PyInstaller
        run: pyinstaller --onefile --name zora rag.py

      - name: Install NSIS
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.09/nsis-3.09.zip" -OutFile nsis.zip
          Expand-Archive nsis.zip -DestinationPath nsis

      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: |
          $makensis = Get-ChildItem -Path nsis -Recurse -Filter makensis.exe | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "makensis: $makensis"
          & $makensis scripts\zora.nsi
          if (-not (Test-Path "zora-installer.exe")) { throw "Installer not produced" }

      - name: Upload Windows installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/zora.exe
            zora-installer.exe

  release:
    name: Publish Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Define tag and version
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0.${GITHUB_SHA:0:7}"
          fi
          NAME="Release $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: release/linux

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release/windows

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Instaladores gerados automaticamente a partir do commit ${{ github.sha }}.

            - **Linux (.deb):** `release/linux/*.deb`
            - **Linux (.rpm):** `release/linux/*.rpm`
            - **Windows (.exe):** `release/windows/zora.exe` e `release/windows/zora-installer.exe`
          files: |
            release/linux/*.deb
            release/linux/*.rpm
            release/windows/zora.exe
            release/windows/zora-installer.exe