[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agente"
version = "1.0.0"
description = "Assistente Pessoal de Pesquisa"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "pypdf",
    "ollama",
]

[project.scripts]
rag = "rag:main"
zora = "rag:main"

[tool.setuptools]
py-modules = ["rag", "seletor", "treinador", "backup", "ollama_setup"]